<meta charset="utf-8">
<title>Oxxy Sales Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav) + working canvas; collapses to a top bar + scrollable tabs under 860px. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --line:#d5dfdc; --fg:#15211f; --muted:#5b6b67;
  --accent:#0d6b5c; --accent-ink:#ffffff; --accent-soft:#d8ece7;
  --ok:#1f7a3f; --ok-soft:#dcf1e2; --warn:#9a5b00; --warn-soft:#fbecd2; --crit:#b42318; --crit-soft:#fbe0dc;
  --info:#2c5aa0; --info-soft:#dfe8f7;
  --bubble-in:#ffffff; --bubble-out:#dff3ea; --chatbg:#e9efe9;
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --sunk:#1c2925; --line:#2a3a35; --fg:#e4ece9; --muted:#93a59f;
  --accent:#4cc2a8; --accent-ink:#06211b; --accent-soft:#163a32;
  --ok:#5fd08a; --ok-soft:#163824; --warn:#f0b45a; --warn-soft:#3a2a10; --crit:#ff8a7a; --crit-soft:#41191a;
  --info:#8fb3ef; --info-soft:#1a2a45;
  --bubble-in:#1c2925; --bubble-out:#14453a; --chatbg:#111c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --sunk:#1c2925; --line:#2a3a35; --fg:#e4ece9; --muted:#93a59f;
  --accent:#4cc2a8; --accent-ink:#06211b; --accent-soft:#163a32;
  --ok:#5fd08a; --ok-soft:#163824; --warn:#f0b45a; --warn-soft:#3a2a10; --crit:#ff8a7a; --crit-soft:#41191a;
  --info:#8fb3ef; --info-soft:#1a2a45;
  --bubble-in:#1c2925; --bubble-out:#14453a; --chatbg:#111c19; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{display:block;font-size:15px}
.brand span{font-size:11px;color:var(--muted)}
.navgroup{margin-top:10px;padding:0 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .count{margin-left:auto;font-size:11px;background:var(--sunk);padding:1px 7px;border-radius:10px;color:var(--muted)}
.nav a.on .count{background:var(--surface);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.main{overflow-y:auto;min-width:0}
.menubtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none}
.menubtn:hover{background:var(--sunk)}
.menubtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.navscrim{display:none;position:fixed;inset:0;background:rgba(10,20,18,.38);z-index:34}
.app.mini{grid-template-columns:68px 1fr}
.app.mini .rail{padding-inline:10px;align-items:stretch}
.app.mini .nav a{justify-content:center;padding:9px}
.app.mini .nav a span,.app.mini .nav a .count,.app.mini .brand div,.app.mini .me div,.app.mini .me button{display:none}
.app.mini .navgroup{height:1px;background:var(--line);padding:0;margin:8px 4px;font-size:0}
.app.mini .brand{justify-content:center;padding:4px 0 12px}
.app.mini .me{justify-content:center;padding-inline:0}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-family:var(--font-mono);font-size:12px;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:13.5px;top:28px;bottom:0;width:1px;background:var(--line)}
.branch{margin-top:6px;font-size:12px;padding:6px 10px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.branch.crit{background:var(--crit-soft);color:var(--crit)}.branch.warn{background:var(--warn-soft);color:var(--warn)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chain .arr{color:var(--muted);font-size:16px}
.tchip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);font-size:13px;max-width:100%}
.tchip b{font-family:var(--font-mono);color:var(--accent)}
.tchip em{font-style:normal;color:var(--muted)}
.tchip.plain{border-style:dashed;color:var(--muted)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.tick{color:var(--ok);font-weight:700}.cross{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0}
.chart small{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:6px;padding:6px 10px;min-width:0;width:260px;max-width:100%}
.topbar .search input{border:0;background:transparent;outline:0;width:100%}
.content{padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.proto-note{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:20px;white-space:nowrap}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:26px;font-weight:600;font-family:var(--font-mono);letter-spacing:-.02em}
.stat .d{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.tag{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:7px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:5px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0}
.check i{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;margin-top:1px}
.check i.y{background:var(--ok-soft);color:var(--ok)}
.check i.n{background:var(--crit-soft);color:var(--crit)}
.check i.w{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* inbox */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:calc(100vh - 160px);min-height:560px}
.inbox > *{min-height:0}
.ilist{border-right:1px solid var(--line);overflow-y:auto}
.iitem{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.iitem:hover{background:var(--sunk)}
.iitem.on{background:var(--accent-soft)}
.iitem .t{min-width:0;flex:1}
.iitem .t b{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.iitem .t p{margin:2px 0 4px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;background:var(--chatbg);min-width:0}
.thread .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:8px 11px;border-radius:9px;background:var(--bubble-in);box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.out{align-self:flex-end;background:var(--bubble-out)}
.bub .meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--muted);margin-top:4px}
.bub .btns{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.bub .btns span{display:block;text-align:center;padding:6px;border-top:1px solid var(--line);color:var(--info);font-weight:600;font-size:13px}
.sys{align-self:center;font-size:11.5px;background:var(--surface);color:var(--muted);padding:3px 10px;border-radius:12px}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;height:40px}
.side{border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.draftbox{border:1px dashed var(--accent);border-radius:8px;padding:10px;background:var(--accent-soft);font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.38);z-index:30;display:flex;justify-content:flex-end}
.drawer{width:440px;max-width:100%;background:var(--surface);height:100%;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-weight:500;max-width:calc(100% - 32px)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login .l{padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:440px;margin:0 auto;width:100%}
.login .r{background:var(--accent);color:var(--accent-ink);padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.login .r p{max-width:40ch;opacity:.9;margin:0}
.login .r blockquote{margin:0;font-size:24px;font-weight:600;line-height:1.25;max-width:22ch;letter-spacing:-.01em}

/* phone simulator */
.simwrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.phone{border:10px solid var(--fg);border-radius:34px;overflow:hidden;height:700px;max-width:100%;display:flex;flex-direction:column;background:var(--chatbg)}
.phone .hd{background:var(--accent);color:var(--accent-ink);padding:12px 14px;display:flex;align-items:center;gap:10px}
.phone .hd .avatar{background:var(--accent-ink);color:var(--accent)}
.phone .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px}
.phone .bub{max-width:86%;font-size:13.5px}
.phone .bub.me{align-self:flex-end;background:var(--bubble-out)}
.qr{display:flex;flex-direction:column;gap:5px;align-self:flex-start;width:86%}
.qr button{background:var(--bubble-in);border:0;border-radius:8px;padding:8px;color:var(--info);font-weight:600;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.qr button:hover{filter:brightness(.97)}
.listmsg{background:var(--bubble-in);border-radius:8px;overflow:hidden;width:86%;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.listmsg button{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:9px 11px;cursor:pointer}
.listmsg button:hover{background:var(--sunk)}
.phone .typer{display:flex;gap:6px;padding:8px;background:var(--surface)}
.phone .typer input{flex:1;border-radius:20px;border:1px solid var(--line);padding:8px 12px;background:var(--bg);min-width:0}
.phone .typer button{border-radius:50%;width:38px;height:38px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;flex:none}
.trace{font-family:var(--font-mono);font-size:12px;display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto}
.trace div{padding:7px 10px;border-radius:6px;background:var(--sunk);overflow-wrap:anywhere}
.trace div b{color:var(--accent);font-weight:500}

/* responsive */
@media (max-width:1180px){.inbox{grid-template-columns:260px minmax(0,1fr)}.inbox .side{display:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app,.app.mini{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:270px;max-width:86%;z-index:35;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .app.navopen .rail{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .app.navopen .navscrim{display:block}
  .app.mini .rail .nav a span,.app.mini .navgroup,.app.mini .brand div,.app.mini .me div,.app.mini .me button{display:revert}
  .app.mini .navgroup{height:auto;background:none;font-size:11px;padding:0 8px 4px;margin:10px 0 0}
  .app.mini .nav a{justify-content:flex-start;padding:7px 10px}
  .app.mini .brand{justify-content:flex-start;padding:4px 8px 16px}
  .g3,.g2,.g21{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr;height:auto}
  .ilist{max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
  .thread{height:520px}
  .simwrap{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login .r{display:none}
  .topbar .search{width:100%;margin-left:0}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.content,.topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.proto-note{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

  const r = route().split('-')[0];
  const nav = NAV.map(([g,items]) => `<div class="navgroup eyebrow">${g}</div><nav class="nav">${items.map(([k,l,i,cnt])=>{const n=cnt?cnt():0;return `<a href="#${k}" title="${l}" class="${r===k||(r==='customer'&&k==='customers')?'on':''}">${ic(i)}<span>${l}</span>${n?`<span class="count">${n}</span>`:''}</a>`}).join('')}</nav>`).join('');
  return `<div class="app ${ui.mini?'mini':''} ${ui.navOpen?'navopen':''}">
    <div class="navscrim" onclick="ui.navOpen=false;render()"></div>
    <aside class="rail" aria-label="Main navigation">
      <div class="brand"><div class="mark">O</div><div><b>Oxxy</b><span>Sales and bot console</span></div></div>
      ${nav}
      <div class="me"><div class="avatar">MK</div><div style="min-width:0"><b style="font-size:13px">Manoj K.</b><div class="small muted">Sales lead</div></div><button class="btn sm" style="margin-left:auto" onclick="logout()">Sign out</button></div>
    </aside>
    <main class="main">
      <div class="topbar"><button class="menubtn" onclick="toggleNav()" aria-label="Show or hide the sidebar">${ic('menu')}</button><div style="min-width:0"><div class="eyebrow">${esc(sub)}</div><h1>${esc(title)}</h1></div>${actions}<span class="proto-note">Prototype · sample data</span>
        <label class="search"><span class="muted small">Search</span><input id="gsearch" placeholder="Name, phone, booking ID" onkeydown="if(event.key==='Enter')globalSearch(this.value)"></label></div>
      <div class="content">${body}</div>
    </main>
  </div>${ui.drawer?drawerHTML():''}`;
}

function Inbox(){

  const c = cust(ui.selConv) || list[0] || customers[0];
  if(!c) return shell('Conversations','WhatsApp inbox','<div class="panel empty">No conversations yet.</div>');
  const thread = THREADS[c.id] || defaultThread(c);
  const paused = ['PAUSED','OPTED_OUT'].includes(c.state);
  const draft = c.id==='C-1042' ? `Yes, I can record a booking request for your mother at Adyar Ortho Care.\n\nWhich date works? Choose a date from 9 Nov 2026 onwards. The Oxxy team will confirm the slot with the centre.` : null;

    <div class="row"><div class="tabs">${[['all','All'],['unread','Unread'],['handoff','Needs a person'],['bookings','Booking in progress']].map(([k,l])=>`<button class="${ui.tabInbox===k?'on':''}" onclick="ui.tabInbox='${k}';render()">${l}</button>`).join('')}</div></div>

      <div class="ilist">${list.map(x=>`<div class="iitem ${x.id===c.id?'on':''}" onclick="ui.selConv='${x.id}';render()"><div class="avatar">${initials(x.name)}</div><div class="t"><b><span>${esc(x.name)}</span><span class="muted small mono" style="font-weight:400">${x.time}</span></b><p>${esc(x.last)}</p><div class="row" style="gap:6px">${statePill(x.state)}${x.unread?`<span class="pill info plain">${x.unread} new</span>`:''}</div></div></div>`).join('') || '<div class="empty">No conversations in this view.</div>'}</div>
      <div class="thread">
        <div class="panel-h" style="background:var(--surface)"><div class="avatar">${initials(c.name)}</div><div><b>${esc(c.name)}</b><div class="small muted mono">${c.phone}</div></div><span class="spacer"></span>${statePill(c.state)}
          <button class="btn sm" onclick="takeOver('${c.id}')">${c.state==='ESCALATED'?'Return to bot':'Take over'}</button></div>
        <div class="msgs">${thread.map(m=> m.s==='sys'?`<div class="sys">${esc(m.t)}</div>`:`<div class="bub ${m.s==='cust'?'':'out'}">${esc(m.t)}${m.btns?`<div class="btns">${m.btns.map(b=>`<span>${esc(b)}</span>`).join('')}</div>`:''}<div class="meta">${m.trig?`<span class="tag">${m.trig}</span>`:''}${m.s==='agent'?'<span>You</span>':m.s==='bot'?'<span>Bot</span>':''}<span>${m.at||''}</span></div></div>`).join('')}</div>

      </div>
      <aside class="side">
        <div><div class="eyebrow">Customer</div><dl class="kv" style="margin-top:8px"><dt>ID</dt><dd class="mono">${c.id}</dd><dt>CRM</dt><dd class="mono">${crmId(c)}</dd><dt>Sales owner</dt><dd>${ownerOf(c)}</dd><dt>City</dt><dd>${esc(c.city)}</dd><dt>Language</dt><dd>${esc(c.lang)}</dd><dt>Product</dt><dd>${productLabel(c)}</dd><dt>Consent</dt><dd>${c.consent?'<span class="pill ok">Given</span>':'<span class="pill warn">Not given</span>'}</dd></dl>

function CustomerProfile(id){
  const c = cust(id); if(!c) return shell('Not found','Customers','<div class="panel empty">No customer with this ID.</div>');
  const plan = PLANS.find(p=>p.code===c.plan);
  let value = '';
  if(c.product==='oxxy' && plan && c.spend){
    const s=Math.floor(c.spend*plan.cap/100/500)*500, cost=Math.round(plan.yearly*(1+GST)), ok=s>cost;
    value = `<div class="panel"><div class="panel-h"><h2>Value check</h2><span class="muted small">Playbook 9.1 and 9.2</span></div><div class="panel-b"><dl class="kv">
      <dt>Annual spend (customer said)</dt><dd class="mono">${inr(c.spend)}</dd>
      <dt>Illustration rate</dt><dd class="mono">${plan.cap}% <span class="muted small">(${plan.name}${plan.cap<30?' cap':''})</span></dd>
      <dt>Illustrated yearly saving</dt><dd class="mono">${inr(s)} <span class="muted small">rounded down to ₹500</span></dd>
      <dt>Yearly price + 18% GST</dt><dd class="mono">${inr(cost)}</dd>
      <dt>Result</dt><dd>${ok?'<span class="pill ok">Passes: savings close allowed</span>':'<span class="pill crit">Fails: no savings close; offer a lower plan or an honest answer</span>'}</dd></dl></div></div>`;
  }
  if(c.product==='cmb' && c.bill){
    const s=Math.round(c.bill*.3), cost=Math.round(CMB.monthly*(1+GST));
    value = `<div class="grid g2"><div class="panel"><div class="panel-h"><h2>Value check</h2><span class="muted small">Cut Medi Bills, Playbook 9.2</span></div><div class="panel-b"><dl class="kv">
      <dt>Estimated bill</dt><dd class="mono">${inr(c.bill)}</dd><dt>30% illustration</dt><dd class="mono">${inr(s)}</dd><dt>Monthly price + GST</dt><dd class="mono">${inr(cost)}</dd>
      <dt>Result</dt><dd>${s>cost?'<span class="pill ok">Passes</span>':'<span class="pill crit">Fails</span>'}</dd></dl></div></div>
      <div class="panel"><div class="panel-h"><h2>Eligibility gate</h2><span class="muted small">Playbook 8.2</span></div><div class="panel-b"><dl class="kv">
      <dt>Appointment</dt><dd>None</dd><dt>Registration</dt><dd>None</dd><dt>Treatment</dt><dd>Not started</dd><dt>Bill</dt><dd>Not generated</dd><dt>Insurance</dt><dd>Has insurance: team must be told before it is applied (Trigger J)</dd>
      <dt>Result</dt><dd><span class="pill ok">Potentially eligible</span></dd></dl></div></div></div>`;
  }
  const bks = bookings.filter(b=>b.cust===id);
  return shell(c.name, 'Bot record · ' + c.id + ' · ' + crmId(c), `
    <div class="row"><a href="#inbox" class="btn sm">← Conversations</a><button class="btn sm" onclick="toast('Opens ${crmId(c)} in the CRM')">Open in CRM</button><a href="#inbox" onclick="ui.selConv='${c.id}'" class="btn sm">Open conversation</a><span class="spacer"></span><button class="btn sm" onclick="customerForm('${c.id}')">Edit</button><button class="btn sm danger" onclick="delCustomer('${c.id}')">Delete</button></div>
    <div class="grid g3">
      <div class="panel"><div class="panel-h"><h2>Profile</h2></div><div class="panel-b"><dl class="kv"><dt>Phone</dt><dd class="mono">${c.phone}</dd><dt>City</dt><dd>${esc(c.city)}</dd><dt>Language</dt><dd>${esc(c.lang)}</dd><dt>Beneficiary</dt><dd>${esc(c.beneficiary||'—')}</dd><dt>Need</dt><dd>${esc(c.need||'—')}</dd><dt>State</dt><dd>${statePill(c.state)}</dd></dl></div></div>
      <div class="panel"><div class="panel-h"><h2>Routing</h2></div><div class="panel-b"><dl class="kv"><dt>Selected product</dt><dd>${productLabel(c)}</dd><dt>Reason</dt><dd>${esc(c.reason||'—')}</dd><dt>Other product</dt><dd>${c.product?'<span class="pill plain">Suppressed</span>':'—'}</dd><dt>Activation</dt><dd>${c.active?'<span class="pill ok">Active</span>':'<span class="pill plain">Not active</span>'}</dd></dl>

function evalTrigger(text, ctx){
  const t = text.toLowerCase(); const steps = [];
  let trig = null, why = '';
  if(/^\[event\]/.test(t)){ trig='Q'; why='Backend event: official link sent, payment not completed'; steps.push(['y','Backend event, not a customer message']); }
  else for(const [k,re,label] of INTENTS){ if(re.test(t)){ trig=k; why=label; break; } }
  if(!trig){ steps.push(['w','No trigger phrase matched: answer the question or ask one discovery question']); return {trig:null, steps}; }
  const lvl = LADDER.findIndex(l=>l[1].split(' · ').includes(trig));
  steps.push(['y',`Matched: ${why} → priority ${lvl+1} of 8`]);
  if(trig==='R'){ steps.push(['y','Safety and opt-out run before everything else and ignore all gates']); return {trig, steps, sent:true}; }
  const gate = (bad,label,reason)=>{ steps.push([bad?'n':'y',label+(bad?` → suppressed (${reason})`:'')]); return bad?reason:null; };
  const reason =
    gate(ctx.optedOut,'Consent and opt-out','opt_out') ||
    gate(ctx.emergencyOpen,'No open safety event','emergency') ||
    gate(ctx.complaintOpen && 'CEFQIL'.includes(trig),'No open complaint blocking activation prompts','active_complaint') ||
    gate(ctx.cmbSelected && ['E','F','C'].includes(trig),'Product lock: Oxxy prompts allowed','active_product') ||
    gate(ctx.alreadySent && trig!=='P','Not already sent in this decision journey','duplicate') ||
    gate(ctx.lateNight && ['N','Q','L'].includes(trig),'Inside 09:00–21:00 for proactive sends','quiet hours, moved to 09:00');
  if(reason) return {trig, steps, sent:false, reason};
  if(trig==='F') steps.push(['y','Savings figure: plan cap applied (Everyday 20%, Vital 25%) and value check vs price + GST']);
  if(trig==='E') steps.push(['y','One recommended plan only; four-plan comparison only if the customer asked to compare']);
  if(trig==='I' && !ctx.cmbSelected) steps.push(['y','Cut Medi Bills only if routing selects it as the better single product']);
  if(trig==='Q') steps.push(['y','Maximum one reminder; no fake urgency']);
  steps.push(['y','One message, one primary action, at most 3 buttons of ≤ 20 characters']);
  steps.push(['y','Record trigger_id, reason, asset version and response; wait for the reply']);
  return {trig, steps, sent:true};
}

    if(/book|centre/.test(t)){ if(sim.locality) ASK.spec(); else startCentre(); return; }
    if(/no,? thanks|no thank|^no$/.test(t) && s==='booked'){ go('declined','FOLLOW_UP'); simSay('Absolutely, no problem. Your booking request is recorded, and the Oxxy team will contact you regarding confirmation. Is there anything else I can help with?'); simTrace('<b>task</b> booking confirmation only · no activation pitch, no second product'); return; }

  }
  if(s==='link'){

  }
  if(s==='cmbBlocked'){ if(/another|yes/.test(t)) startCentre(); else { go('closed','CLOSED'); simSay('No problem. You may message Oxxy whenever healthcare support is needed.'); } return; }
  if(s==='cmbAmount'){
    const a=parseAmt(t); if(!a){ simSay('A rough figure is fine, for example 80000 or 1.8 lakh.'); return; }

    go('futime','FOLLOW_UP_TIME'); fire('N'); simSay('No pressure. Would tomorrow at 11:00 or tomorrow at 18:00 be better for a quick follow-up?',{btns:['Tomorrow 11:00','Tomorrow 18:00','Close the chat']}); return;

  if(s==='pick'){
    const n=parseInt(t,10); sim.centre = (n>=1&&n<=sim.options.length) ? sim.options[n-1].replace(' – ',', ') : raw.trim();
    if(!(n>=1&&n<=sim.options.length)) simTrace('<b>verify</b> customer named another centre → check it exists and the branch is correct');

  if(s==='date'){

  const lab = `<label for="${id}">${esc(f.label)}${star}</label>`;
  if(f.type==='checkbox') return `<label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}>${esc(f.label)}</label>${hint}`;
  if(f.type==='select') return `<div class="field">${lab}<select id="${id}" name="${f.k}" class="input">${f.options.map(o=>{ const [ov,ol] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}" ${String(ov)===String(v??'')?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>${hint}</div>`;
  if(f.type==='textarea') return `<div class="field">${lab}<textarea id="${id}" name="${f.k}" class="input" rows="${f.rows||4}">${esc(v??'')}</textarea>${hint}</div>`;
  const mono = ['number','date','time'].includes(f.type) ? ' mono' : '';
  return `<div class="field">${lab}<input id="${id}" name="${f.k}" class="input${mono}" type="${f.type||'text'}" value="${esc(v??'')}"${f.min!==undefined?` min="${f.min}"`:''}${f.max!==undefined?` max="${f.max}"`:''}${f.step?` step="${f.step}"`:''}>${hint}</div>`;
}
function formHTML(){
  return `<div class="scrim" onclick="if(event.target===this)closeDrawer()"><div class="drawer" role="dialog" aria-label="${esc(FORM.title)}">
    <div class="row"><h2>${esc(FORM.title)}</h2><span class="spacer"></span><button class="btn sm" onclick="closeDrawer()">Close</button></div>
    ${FORM.note?`<div class="small muted">${FORM.note}</div>`:''}
    <form class="grid" style="gap:12px" onsubmit="event.preventDefault();submitForm()" novalidate>
      ${FORM.fields.map(f=>fieldHTML(f, FORM.values[f.k])).join('')}
      <div id="formErr" class="small" style="color:var(--crit);font-weight:600" role="alert"></div>
      <div class="row"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" onclick="closeDrawer()">Cancel</button></div>
    </form></div></div>`;
}
function formErr(m){ const e=document.getElementById('formErr'); if(e) e.textContent=m; }
function submitForm(){
  const v = {};
  for(const f of FORM.fields){
    const el = document.querySelector(`.drawer [name="${f.k}"]`); if(!el) continue;
    if(f.type==='checkbox'){ v[f.k]=el.checked; continue; }
    const x = el.value.trim();
    if(f.req && x==='') return formErr(f.label+' is required.');
    if(f.type==='number' && x!==''){ const n=Number(x); if(!isFinite(n)) return formErr(f.label+' must be a number.'); if(f.min!==undefined&&n<f.min) return formErr(`${f.label} must be at least ${f.min}.`); if(f.max!==undefined&&n>f.max) return formErr(`${f.label} must be at most ${f.max}.`); v[f.k]=n; }
    else v[f.k]=x;
  }
  const err = FORM.onSave(v);
  if(err) return formErr(err);
  FORM=null; ui.drawer=null; render();
}
function askDelete(what, fn, note='', verb='Delete'){ CONFIRM={what, fn, note, verb}; ui.drawer={type:'confirm'}; render(); }
function confirmHTML(){

function proposePrice(){
  openForm('Propose price change', [
    {k:'plan',label:'Plan',type:'select',options:PLANS.map(p=>[p.code,p.name])},
    {k:'field',label:'Price',type:'select',options:[['yearly','Yearly price'],['monthly','Monthly price']]},
    {k:'to',label:'New price (₹, excl. GST)',type:'number',req:true,min:1},
    {k:'reason',label:'Reason',req:true},
  ], {plan:'everyday',field:'yearly'}, v=>{
    const p = PLANS.find(x=>x.code===v.plan);
    if(v.to===p[v.field]) return 'The new price is the same as the current one.';
    if(priceChanges.some(c=>!c.approver && c.plan===v.plan && (c.field||'yearly')===v.field)) return 'This price already has a change waiting for approval.';
    const id = nextId('PC-',priceChanges);
    priceChanges.push({id,plan:v.plan,field:v.field,from:p[v.field],to:v.to,by:'Manoj K.',at:'Now',approver:null,reason:v.reason});
    logA('plan_catalog.propose',p.name+' '+v.field+' '+inr(p[v.field])+' → '+inr(v.to)); toast('Proposed. A second person must approve it.');
  }, 'The person who proposes a price cannot approve it.');
}
function approvePrice(id, who='Manoj K.'){
  const pc = priceChanges.find(p=>p.id===id); const p = PLANS.find(x=>x.code===pc.plan);
  if(who===pc.by){ toast('The proposer cannot approve their own change'); return; }
  pc.approver = who; p[pc.field||'yearly'] = pc.to;
  logA('plan_catalog.approve',p.name+' '+(pc.field||'yearly')+' → '+inr(pc.to)+' · approved by '+who); render(); toast(p.name+' price updated after second approval');
}
function delPrice(id){ const pc=priceChanges.find(p=>p.id===id); askDelete((pc.by==='Manoj K.'?'your proposal ':'proposal ')+id, ()=>{ priceChanges=priceChanges.filter(p=>p.id!==id); logA('plan_catalog.reject',id+' · '+planName(pc.plan)); toast(id+(pc.by==='Manoj K.'?' withdrawn':' rejected')); }); }
function pcActions(pc){
  if(pc.approver) return '<span class="pill ok">Approved</span>';
  if(pc.by==='Manoj K.') return acts('',`delPrice('${pc.id}')`,`<button class="btn sm" onclick="approvePrice('${pc.id}','Naveen R.')">Demo: Naveen approves</button>`);
  return acts('',`delPrice('${pc.id}')`,`<button class="btn sm pri" onclick="approvePrice('${pc.id}')">Approve</button>`);
}

/* templates */
function tplForm(name){
  const t = name ? templates.find(x=>x.name===name) : {cat:'Utility',lang:'en, hi',body:''};
  openForm(name?'Edit template':'New template', [
    {k:'name',label:'Template name',req:true,hint:'Lowercase letters, numbers and underscores, ending in a version, for example booking_moved_v1'},
    {k:'cat',label:'Category',type:'select',options:['Utility','Marketing','Authentication']},
    {k:'lang',label:'Languages',req:true,hint:'en, hi'},
    {k:'body',label:'Message',type:'textarea',rows:6,req:true,hint:'Use {{1}}, {{2}} for values. Max 1,024 characters.'},
  ], t, v=>{
    if(!/^[a-z0-9_]+_v\d+$/.test(v.name)) return 'Name must be lowercase with underscores and end in a version like _v1.';
    if(templates.some(x=>x!==t && x.name===v.name)) return 'A template with this name already exists.';
    if(v.body.length>1024) return 'WhatsApp templates can be at most 1,024 characters.';
    if(/last chance|forever|hurry|act now|only today|today only/i.test(v.body)) return 'False urgency is not allowed (no dark patterns, Playbook 2.1).';
    if(/insurance/i.test(v.body) && !/not insurance/i.test(v.body)) return 'Never describe Oxxy as insurance.';
    if(v.cat==='Marketing' && !/stop/i.test(v.body)) return 'Marketing templates must tell the customer how to opt out (for example “Reply STOP to opt out”).';
    const wasLive = name && t.status!=='Draft';
    if(!name){ templates.unshift({...v,status:'Draft',edited:'Now'}); logA('templates.insert',v.name); toast('Draft saved. Submit it to Meta when ready.'); }
    else { if(name!==v.name) followups.forEach(f=>{ if(f.template===name) f.template=v.name; }); Object.assign(t,v,{status:'Draft',edited:'Now'}); logA('templates.update',v.name); toast(wasLive?'Saved as draft: Meta must review the change again':'Template saved'); }
  }, name&&t.status!=='Draft'?'Editing an approved or submitted template turns it back into a draft that Meta must review again.':'');
}
function delTpl(name){
  const used = followups.filter(f=>f.template===name && f.status==='scheduled').map(f=>f.id);
  if(used.length){ toast('Used by scheduled follow-up '+used.join(', ')+'. Cancel it first.'); return; }
  askDelete('template '+name, ()=>{ templates=templates.filter(t=>t.name!==name); logA('templates.delete',name); toast('Template deleted'); });
}
function setTpl(n,s){ templates.find(t=>t.name===n).status=s; logA('templates.submit',n); render(); toast('Submitted to Meta for review'); }
function Templates(){
  const pill = s => ({Approved:'<span class="pill ok">Approved</span>','In review':'<span class="pill warn">In review</span>',Rejected:'<span class="pill crit">Rejected</span>',Draft:'<span class="pill plain">Draft</span>'}[s]);

      <div class="panel-b grid" style="gap:10px"><div class="row small muted"><span>${t.cat}</span><span>·</span><span>${esc(t.lang)}</span><span>·</span><span>Edited ${t.edited}</span></div>
      <div class="bub out" style="max-width:100%">${esc(t.body)}</div>
      ${t.status==='Rejected'?'<div class="small" style="color:var(--crit)">Rejected internally: false urgency breaks the no-dark-patterns rule (Trigger Q, Playbook 2.1). Rewrite without “last chance”, “today” or “forever”.</div>':''}
      <div class="row">${t.status==='Draft'||t.status==='Rejected'?`<button class="btn sm pri" onclick="setTpl('${t.name}','In review')">Submit to Meta</button>`:''}${t.status==='In review'?`<button class="btn sm" onclick="templates.find(x=>x.name==='${t.name}').status='Approved';logA('templates.approved','${t.name}');render();toast('Demo: Meta approved it')">Demo: Meta approves</button>`:''}<span class="spacer"></span>${acts(`tplForm('${t.name}')`,`delTpl('${t.name}')`)}</div></div></div>`).join('')}</div>`);

function saveConfig(){
  const a = document.getElementById('qh1').value.trim(), b = document.getElementById('qh2').value.trim();
  const ok = s => /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
  if(!ok(a)||!ok(b)){ toast('Use 24-hour time like 09:00'); return; }
  if(a>=b){ toast('The earliest send time must be before the latest'); return; }
  CONFIG.qStart=a; CONFIG.qEnd=b; logA('config.update','Quiet hours '+a+'–'+b); render(); toast('Configuration saved');
}
function linksForm(){
  openForm('Official links and contacts', [
    {k:'website',label:'Website',req:true},{k:'policies',label:'Policies page',req:true},{k:'cmb',label:'Cut Medi Bills page',req:true},
    {k:'phone',label:'Support phone',req:true},{k:'email',label:'Support email',type:'email',req:true},
  ], CONFIG, v=>{
    for(const k of ['website','policies','cmb']) if(!/^https:\/\/(www\.)?oxxy\.in(\/|$)/.test(v[k])) return 'Only official https://www.oxxy.in links may be sent to customers.';
    if(!/^\d{10}$/.test(v.phone.replace(/\D/g,''))) return 'Support phone must be 10 digits.';
    if(!/^[^@\s]+@oxxy\.in$/i.test(v.email)) return 'Support email must be an @oxxy.in address.';
    Object.assign(CONFIG,v); logA('config.update','Official links and contacts'); toast('Saved');
  }, 'The bot may send only these links and contacts.');
}
function decisionForm(i){
  const d = i==null ? {q:'',answer:'',status:'Open'} : decisions[i];
  openForm(i==null?'Add decision':'Decision '+(i+1), [
    {k:'q',label:'Question',type:'textarea',rows:2,req:true},
    {k:'answer',label:'Answer',type:'textarea',rows:3},
    {k:'status',label:'Status',type:'select',options:['Open','Decided']},
  ], d, v=>{
    if(v.status==='Decided' && !v.answer) return 'Write the answer before marking it decided.';
    if(i==null){ decisions.push(v); logA('decisions.insert',v.q); toast('Decision added'); }
    else { Object.assign(decisions[i],v); logA('decisions.update',v.q.slice(0,60)+' · '+v.status); toast('Saved'); }
  });
}
function delDecision(i){ const d=decisions[i]; askDelete('this decision', ()=>{ decisions.splice(i,1); logA('decisions.delete',d.q.slice(0,60)); toast('Decision deleted'); }); }

    </div>

      ${decisions.map((d,i)=>`<tr><td class="mono small muted" style="width:40px">${i+1}</td><td>${esc(d.q)}${d.answer?`<div class="small muted">Answer: ${esc(d.answer)}</div>`:''}</td><td>${d.status==='Decided'?'<span class="pill ok">Decided</span>':'<span class="pill warn plain">Confirm</span>'}</td><td>${acts(`decisionForm(${i})`,`delDecision(${i})`)}</td></tr>`).join('')||'<tr><td class="empty">No decisions listed.</td></tr>'}

/* reports */
function reportForm(i){
  const r = i==null ? {name:'',to:'Sales team',every:'Monday 09:00'} : reportsSched[i];
  openForm(i==null?'Schedule a report':'Edit report', [
    {k:'name',label:'Report',req:true},{k:'to',label:'Send to',req:true},{k:'every',label:'Every',req:true,hint:'Monday 09:00, Daily 18:00, 1st of month'},
  ], r, v=>{ if(i==null){ reportsSched.push(v); logA('reports.insert',v.name); toast('Report scheduled'); } else { Object.assign(reportsSched[i],v); logA('reports.update',v.name); toast('Saved'); } });
}
function delReport(i){ const r=reportsSched[i]; askDelete('the scheduled report “'+r.name+'”', ()=>{ reportsSched.splice(i,1); logA('reports.delete',r.name); toast('Report removed'); }); }

      <div class="panel"><div class="panel-h"><h2>Product mix (active)</h2></div><div class="panel-b grid" style="gap:10px">
        ${[['Everyday',412],['Vital',386],['Thrive',301],['Infinity',95],['Cut Medi Bills',90]].map(([l,v])=>`<div class="grid" style="grid-template-columns:110px 1fr 50px;gap:10px;align-items:center"><span class="small">${l}</span><div class="bar"><span style="width:${v/412*100}%"></span></div><span class="mono small" style="text-align:right">${v}</span></div>`).join('')}

      ${reportsSched.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.to)}</td><td class="small mono">${esc(r.every)}</td><td>${acts(`reportForm(${i})`,`delReport(${i})`,`<button class="btn sm" onclick="toast('Report run (prototype)')">Run now</button>`)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No scheduled reports.</td></tr>'}

/* system health incidents */
function incidentForm(i){
  const r = i==null ? {at:'Today '+nowStamp().slice(11),level:'warn',title:'',detail:''} : incidents[i];
  openForm(i==null?'Log incident':'Edit incident', [
    {k:'at',label:'When',req:true},{k:'level',label:'Status',type:'select',options:[['crit','Down'],['warn','Watching'],['ok','Resolved']]},
    {k:'title',label:'What happened',req:true},{k:'detail',label:'Detail and next step',type:'textarea',rows:3},
  ], r, v=>{ if(i==null){ incidents.unshift(v); logA('incidents.insert',v.title); toast('Incident logged'); } else { Object.assign(incidents[i],v); logA('incidents.update',v.title); toast('Saved'); } });
}
function delIncident(i){ const r=incidents[i]; askDelete('the incident “'+r.title+'”', ()=>{ incidents.splice(i,1); logA('incidents.delete',r.title); toast('Incident deleted'); }); }

      <div class="panel stat"><span class="eyebrow">Validator rejections</span><span class="v">4.1%</span><span class="d">Redrafted automatically</span></div>
      <div class="panel stat"><span class="eyebrow">Fallback messages</span><span class="v">7</span><span class="d">Sent when Claude failed twice</span></div>
    </div>

        ${[['Savings above plan cap',41],['Button title over 20 chars',27],['More than one call to action',14],['Mentions a centre tie-up',9],['Booking shown as confirmed',6],['Other',3]].map(([l,v])=>`<div class="grid" style="grid-template-columns:minmax(0,1fr) 120px 30px;gap:10px;align-items:center"><span class="small">${l}</span><div class="bar"><span style="width:${v/41*100}%"></span></div><span class="mono small" style="text-align:right">${v}</span></div>`).join('')}
      </div></div>
    </div>
    <div class="panel"><div class="panel-h"><h2>Incidents</h2><span class="spacer"></span><button class="btn sm pri" onclick="incidentForm()">Log incident</button></div><div class="tbl-wrap"><table><tbody>
      ${incidents.map((r,i)=>`<tr><td class="mono small" style="white-space:nowrap">${esc(r.at)}</td><td><span class="dot ${r.level==='ok'?'':r.level}"></span></td><td><b>${esc(r.title)}</b><div class="small muted">${esc(r.detail)}</div></td><td>${acts(`incidentForm(${i})`,`delIncident(${i})`, r.level!=='ok'?`<button class="btn sm" onclick="incidents[${i}].level='ok';logA('incidents.resolve',incidents[${i}].title);render();toast('Marked resolved')">Resolve</button>`:'')}</td></tr>`).join('')||'<tr><td class="empty">No incidents.</td></tr>'}
    </tbody></table></div></div>`);
}

/* ---------- router ---------- */
function render(){
  const root = document.getElementById('root');
  if(!ui.loggedIn){ root.innerHTML = Login(); return; }
  const r = route();
  const scrollEl = document.querySelector('.main'); const st = scrollEl?scrollEl.scrollTop:0;
  let html;
  if(r.startsWith('customer-')) html = CustomerProfile(r.slice(9));
  else html = ({dashboard:Dashboard,inbox:Inbox,customers:Customers,bookings:Bookings,tasks:Tasks,followups:Followups,activations:Activations,centres:Centres,plans:Plans,triggers:Triggers,flow:TriggerFlow,audit:Audit,config:Config,simulator:Simulator,login:Login,admin:AdminHome,users:Users,roles:Roles,integrations:Integrations,crm:CrmSync,templates:Templates,privacy:Privacy,health:Health,reports:Reports}[r] || Dashboard)();
  root.innerHTML = html;
  const ne = document.querySelector('.main'); if(ne) ne.scrollTop = st;
  const m = document.querySelector('.thread .msgs'); if(m) m.scrollTop = m.scrollHeight;
}
window.addEventListener('hashchange', ()=>{ ui.navOpen=false; const m=document.querySelector('.main'); if(m) m.scrollTop=0; if(route()==='login'){ui.loggedIn=false} render(); });
render();
</script>
